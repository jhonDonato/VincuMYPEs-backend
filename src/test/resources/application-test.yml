spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

app:
  email:
    verification:
      enabled: false
  jwt:
    secret: "TestSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm1234567890"
    expiration: 3600000
    access-expiration: 3600000
    refresh-expiration: 3600000
    refresh-expiration-remember: 604800000
  login:
    max-attempts: 5
    block-duration-minutes: 10

