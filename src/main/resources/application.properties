spring.application.name=mypelink-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mypelink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# AWS S3 CONFIGURATION (ARCHIVOS Y PDFs)
# ==========================================
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_BUCKET_NAME}

# --- MYPElink Admins ---
admin.enzo.name=${ADMIN_ENZO_NAME}
admin.enzo.email=${ADMIN_ENZO_EMAIL}
admin.enzo.password=${ADMIN_ENZO_PWD}

admin.marco.name=${ADMIN_MARCO_NAME}
admin.marco.email=${ADMIN_MARCO_EMAIL}
admin.marco.password=${ADMIN_MARCO_PWD}

admin.jhon.name=${ADMIN_JHON_NAME}
admin.jhon.email=${ADMIN_JHON_EMAIL}
admin.jhon.password=${ADMIN_JHON_PWD}

admin.gianpiero.name=${ADMIN_GIANPIERO_NAME}
admin.gianpiero.email=${ADMIN_GIANPIERO_EMAIL}
admin.gianpiero.password=${ADMIN_GIANPIERO_PWD}

admin.segundo.name=${ADMIN_SEGUNDO_NAME}
admin.segundo.email=${ADMIN_SEGUNDO_EMAIL}
admin.segundo.password=${ADMIN_SEGUNDO_PWD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:mypelink-secret-key-cajamarca-2026-upn-capstone-muy-larga}
app.jwt.expiration=86400000

spring.flyway.enabled=false
spring.jpa.open-in-view=false
server.port=8080

logging.level.org.springframework.security=DEBUG
logging.level.com.mypelink=DEBUG